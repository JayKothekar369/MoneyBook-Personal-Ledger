<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Metallic Navy / Deep Teal Gradient for Pages/Outer outline -->
    <linearGradient id="metallicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5b7c" />
      <stop offset="30%" stop-color="#163b53" />
      <stop offset="70%" stop-color="#0d2d44" />
      <stop offset="100%" stop-color="#051622" />
    </linearGradient>

    <!-- Highlight steel blue gradient -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ea3cc" />
      <stop offset="100%" stop-color="#1b5b7c" />
    </linearGradient>

    <!-- Dark shadow definition -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g transform="translate(0, -10)">
    <!-- Shield / Book Base Layer -->
    <path d="M 400 405 C 445 405 510 338 510 190 L 490 190 C 490 315 435 380 400 380 C 365 380 310 315 310 190 L 290 190 C 290 338 355 405 400 405 Z" fill="url(#metallicGrad)" filter="url(#dropShadow)" />

    <!-- Open Book Left Outer Layer -->
    <path d="M 400 365 C 375 350 320 280 320 180 L 305 180 C 305 285 365 365 400 380 Z" fill="url(#steelGrad)" />
    
    <!-- Open Book Right Outer Layer -->
    <path d="M 400 365 C 425 350 480 280 480 180 L 495 180 C 495 285 435 365 400 380 Z" fill="url(#steelGrad)" />

    <!-- Outer vertical book bindings -->
    <rect x="290" y="170" width="8" height="180" rx="3" fill="url(#metallicGrad)" />
    <rect x="502" y="170" width="8" height="180" rx="3" fill="url(#metallicGrad)" />

    <!-- Open Book Left Page Pages Layer -->
    <path d="M 400 350 C 370 335 330 250 330 160 L 342 150 C 342 235 375 315 400 330 Z" fill="url(#steelGrad)" />
    
    <!-- Open Book Right Page Pages Layer -->
    <path d="M 400 350 C 430 335 470 250 470 160 L 458 150 C 458 235 425 315 400 330 Z" fill="url(#steelGrad)" />

    <!-- Central Book Pages forming the prominent 'M' structure -->
    <!-- Left Wing of M -->
    <path d="M 400 340 C 365 310 350 200 350 140 L 365 130 C 365 190 380 290 400 310 Z" fill="url(#metallicGrad)" />
    <!-- Right Wing of M -->
    <path d="M 400 340 C 435 310 450 200 450 140 L 435 130 C 435 190 420 290 400 310 Z" fill="url(#metallicGrad)" />

    <!-- Inner page lines (Left) -->
    <path d="M 372 135 C 372 195 390 280 400 300 L 400 290 C 390 270 378 190 378 138 Z" fill="url(#steelGrad)" />
    <!-- Inner page lines (Right) -->
    <path d="M 428 135 C 428 195 410 280 400 300 L 400 290 C 410 270 422 190 422 138 Z" fill="url(#steelGrad)" />

    <!-- Indian Rupee Symbol '₹' beautifully placed in the center page crease -->
    <!-- Colored with steel gradients, matching the brand icon -->
    <g transform="translate(380, 205)" fill="url(#metallicGrad)">
      <path d="M 5 0 H 35 V 7 H 22 C 22 7 22 13 22 15 H 35 V 22 H 22 C 20 32 10 36 2 36 V 28 C 8 28 13 25 15 22 H 5 V 15 H 15 C 15 13 14 7 14 7 H 5 Z" />
      <path d="M 12 21 L 28 42 H 18 L 4 21 Z" />
    </g>
  </g>

  <!-- Typography matching exact brand representation -->
  <!-- "MONEYBOOK" in premium modern font -->
  <text x="400" y="475" 
        font-family="'Outfit', 'Inter', sans-serif" 
        font-weight="800" 
        font-size="52" 
        fill="#0d2d44" 
        letter-spacing="4" 
        text-anchor="middle">MONEYBOOK</text>

  <!-- "PERSONAL LEDGER PLATFORM" subtext -->
  <text x="400" y="515" 
        font-family="'Outfit', 'Inter', sans-serif" 
        font-weight="600" 
        font-size="20" 
        fill="#4ea3cc" 
        letter-spacing="6" 
        text-anchor="middle">PERSONAL LEDGER PLATFORM</text>
</svg>
